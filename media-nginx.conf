server {
    listen 80;
    server_name _;

    root /media;
    autoindex off;

    # Deny dotfiles and temp dir
    location ~ /\. {
        deny all;
        return 404;
    }

    # WebP variants degrade to 960 rather than 404 when a variant has been
    # reclaimed (feature 008). Pages are cached for a year with `immutable`, so
    # a client can hold an address for a variant that no longer exists; 960 is
    # generated for every media kind and is never reclaimed, which is what makes
    # it a safe universal fallback.
    location ~* ^/(?<mid>[^/]+)/(320|960|1600)\.webp$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri /$mid/960.webp =404;
    }

    # Video gets its own location so the placeholder fallback below can NEVER
    # answer an image address. On the shared location a stale original.gif would
    # receive an MP4 body under an image URL, and `nosniff` guarantees the
    # browser cannot recover from that — a broken image, which is exactly the
    # visible failure the placeholder exists to prevent (feature 011).
    location ~* ^/.+\.mp4$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri /_deleted.mp4;
    }

    # Only serve known media extensions. Images keep =404: their own fallback is
    # the WebP rule above, and original.gif is exempt from age-based reclaim.
    location ~* ^/.+\.(webp|jpg|jpeg|png|gif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Expired-video placeholder. Shipped in the repo at media-assets/ and
    # bind-mounted at /assets, deliberately outside the media volume — that
    # volume holds only user uploads and a restore of it must not be able to
    # remove this file.
    #
    # Exact match is required, not cosmetic: `try_files` above performs an
    # INTERNAL REDIRECT, which re-runs location matching. A regex match would
    # re-apply `immutable` to the placeholder, letting a client cache it under
    # the address of a video for a year. An `=` location outranks every regex
    # location, so the no-store header is guaranteed.
    location = /_deleted.mp4 {
        root /assets;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    # Deny everything else (including directory listing, meta.json, etc.)
    location / {
        return 403;
    }
}

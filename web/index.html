<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Вопли</title>
    <meta name="description" content="Вопли — социалка для гиков и геймеров. Короткие мысли, мемы, без шума и рекламы." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Вопли" />
    <meta property="og:title" content="Вопли" />
    <meta property="og:description" content="Для гиков и геймеров. Мысли, мемы, без шума и рекламы." />
    <meta property="og:url" content="https://vopley.net" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Вопли" />
    <meta name="twitter:description" content="Для гиков и геймеров. Мысли, мемы, без шума и рекламы." />
    <link rel="canonical" href="https://vopley.net" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              th: {
                page:       'rgb(var(--th-page) / <alpha-value>)',
                feed:       'rgb(var(--th-feed) / <alpha-value>)',
                card:       'rgb(var(--th-card) / <alpha-value>)',
                elevated:   'rgb(var(--th-elevated) / <alpha-value>)',
                inset:      'rgb(var(--th-inset) / <alpha-value>)',
                input:      'rgb(var(--th-input) / <alpha-value>)',
                text:       'rgb(var(--th-text) / <alpha-value>)',
                'text-2':   'rgb(var(--th-text-2) / <alpha-value>)',
                'text-3':   'rgb(var(--th-text-3) / <alpha-value>)',
                'text-4':   'rgb(var(--th-text-4) / <alpha-value>)',
                border:     'rgb(var(--th-border) / <alpha-value>)',
                'border-2': 'rgb(var(--th-border-2) / <alpha-value>)',
                ring:       'rgb(var(--th-ring) / <alpha-value>)',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* ===== Light theme (default) ===== */
      :root {
        --th-page:     240 240 242;
        --th-feed:     233 233 236;
        --th-card:     255 255 255;
        --th-elevated: 224 224 228;
        --th-inset:    240 240 242;
        --th-input:    224 224 228;
        --th-text:      18  18  22;
        --th-text-2:    52  52  60;
        --th-text-3:    96  96 106;
        --th-text-4:   140 140 150;
        --th-border:   196 196 204;
        --th-border-2: 216 216 222;
        --th-ring:       0   0   0;
      }

      /* ===== Dark theme ===== */
      .dark {
        --th-page:      19  19  20;
        --th-feed:      24  24  26;
        --th-card:      30  30  30;
        --th-elevated:  51  51  51;
        --th-inset:     24  24  27;
        --th-input:     39  39  42;
        --th-text:     255 255 255;
        --th-text-2:   228 228 231;
        --th-text-3:   161 161 170;
        --th-text-4:   113 113 122;
        --th-border:    63  63  70;
        --th-border-2:  39  39  42;
        --th-ring:     255 255 255;
      }

      body {
        background-color: rgb(var(--th-page));
        color: rgb(var(--th-text));
        transition: background-color 0.2s, color 0.2s;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--th-page));
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--th-border));
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--th-text-4));
      }

      /* Safari backdrop-filter prefix fallback */
      .backdrop-blur-sm {
        -webkit-backdrop-filter: blur(4px);
      }

      /* Strikethrough drawn at a fixed vertical center instead of relying on
         the browser's native line-through, whose position comes from the
         active font's own strikeout metrics and varies noticeably between
         platforms (e.g. Segoe UI vs. San Francisco vs. Roboto). Implemented
         as a native underline shifted up via text-underline-offset (a real,
         tunable CSS property — there's no equivalent offset control for
         line-through) so it renders as a normal text decoration: correctly
         follows wrapped lines, no custom box/positioning math involved. */
      .strike-mid {
        text-decoration-line: underline;
        text-decoration-thickness: 0.08em;
        text-underline-offset: -0.4em;
        text-decoration-skip-ink: none;
      }

      /* GTA6 cosmetic (toggled via useGta6): neon strip circling the shout composer */
      @property --neon-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      .neon-frame {
        position: relative;
        isolation: isolate;
      }
      .neon-frame::before,
      .neon-frame::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        padding: 2px;
        background: conic-gradient(
          from var(--neon-angle),
          transparent 0deg,
          #ff2d95 40deg,
          #ff8a3d 80deg,
          #ffd23f 100deg,
          transparent 140deg,
          transparent 180deg,
          #00e5ff 220deg,
          #b14bff 260deg,
          #ff2d95 290deg,
          transparent 330deg
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
        animation: neon-spin 8s linear infinite;
        pointer-events: none;
        z-index: 1;
      }
      .neon-frame::after {
        inset: -8px;
        padding: 8px;
        border-radius: 14px;
        filter: blur(6px);
        opacity: 0.7;
        z-index: -1;
      }
      @keyframes neon-spin {
        to { --neon-angle: 360deg; }
      }
      @media (prefers-reduced-motion: reduce) {
        .neon-frame::before, .neon-frame::after { animation: none; }
      }

      /* GTA6 neon ? toggle */
      .neon-toggle {
        width: 28px; height: 28px;
        border-radius: 50%;
        border: 2px solid #ff2d95;
        background: transparent;
        color: #ff2d95;
        font-weight: 900;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        position: relative;
        transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
        box-shadow: 0 0 6px #ff2d95, inset 0 0 4px rgba(255,45,149,0.3);
        animation: neon-glow 1.5s ease-in-out infinite alternate;
      }
      .neon-toggle:hover {
        color: #fff;
        border-color: #ff8a3d;
        box-shadow: 0 0 12px #ff8a3d, inset 0 0 6px rgba(255,138,61,0.4);
      }
      .neon-toggle.active {
        color: #ffd23f;
        border-color: #ffd23f;
        box-shadow: 0 0 10px #ffd23f, inset 0 0 5px rgba(255,210,63,0.4);
      }
      @keyframes neon-glow {
        from { box-shadow: 0 0 4px #ff2d95, inset 0 0 2px rgba(255,45,149,0.2); }
        to   { box-shadow: 0 0 12px #ff2d95, 0 0 24px rgba(255,45,149,0.3), inset 0 0 6px rgba(255,45,149,0.3); }
      }

      /* GTA6 neon heart like icon */
      .neon-heart {
        display: inline-block;
        font-style: normal;
        transition: filter 0.2s, transform 0.15s;
      }
      .neon-heart.liked {
        filter: drop-shadow(0 0 4px #ff2d95) drop-shadow(0 0 8px rgba(255,45,149,0.5));
      }
      .neon-heart:not(.liked) {
        filter: drop-shadow(0 0 2px rgba(255,45,149,0.3));
        opacity: 0.7;
      }

      /* GTA6 neon dice button */
      .neon-dice {
        color: #00e5ff;
        transition: color 0.3s, filter 0.3s;
        animation: neon-dice-glow 3s ease-in-out infinite alternate;
      }
      .neon-dice:hover {
        color: #ff2d95;
        filter: drop-shadow(0 0 6px #ff2d95);
      }
      @keyframes neon-dice-glow {
        0%   { filter: drop-shadow(0 0 2px rgba(0,229,255,0.3)); color: #00e5ff; }
        33%  { filter: drop-shadow(0 0 5px rgba(177,75,255,0.5)); color: #b14bff; }
        66%  { filter: drop-shadow(0 0 5px rgba(255,210,63,0.5)); color: #ffd23f; }
        100% { filter: drop-shadow(0 0 2px rgba(0,229,255,0.3)); color: #00e5ff; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
